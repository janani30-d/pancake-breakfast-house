
<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enquire | Pancake & Breakfast House</title>

    <link rel="icon" type="image/png" href="images/logo.png">

    <meta name="description"
          content="Get in touch with Pancake & Breakfast House. Send us your questions and enquiries.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Font Awesome (for button arrow) -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <!-- Responsive CSS -->
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

<main class="login-page enquiry-layout" id="enquiryLayout">

    <!-- =====================================================
         TOP BAR — LOGO + RTL + DARK MODE
    ====================================================== -->

    <div class="login-topbar">

        <!-- Logo -->
        <a href="index.html"
           class="login-topbar-logo"
           aria-label="Pancake & Breakfast House home">

            <img src="images/logo.png"
                 alt="Pancake & Breakfast House">
        </a>

        <!-- Right-Side Controls -->
        <div class="login-topbar-actions">

            <!-- RTL Toggle -->
            <button
                type="button"
                class="login-topbar-btn"
                id="loginRtlToggle"
                aria-label="Switch to right-to-left layout"
                aria-pressed="false"
                title="RTL Mode">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg"
                     aria-hidden="true">

                    <path
                        d="M4 7H19M15 3L19 7L15 11"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>

                    <path
                        d="M20 17H5M9 13L5 17L9 21"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>
                </svg>

            </button>

            <!-- Dark Mode Toggle -->
            <button
                type="button"
                class="login-topbar-btn"
                id="loginDarkToggle"
                aria-label="Enable dark mode"
                aria-pressed="false"
                title="Dark Mode">

                <!-- Moon Icon -->
                <svg class="login-moon-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg"
                     aria-hidden="true">

                    <path
                        d="M20.5 15.3A8.5 8.5 0 0 1 8.7 3.5A8.5 8.5 0 1 0 20.5 15.3Z"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"
                        stroke-linejoin="round"/>
                </svg>

                <!-- Sun Icon -->
                <svg class="login-sun-icon"
                     viewBox="0 0 24 24"
                     fill="none"
                     xmlns="http://www.w3.org/2000/svg"
                     aria-hidden="true">

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                        stroke="currentColor"
                        stroke-width="1.7"/>

                    <path
                        d="M12 2V4M12 20V22M4.93 4.93L6.35 6.35M17.65 17.65L19.07 19.07M2 12H4M20 12H22M4.93 19.07L6.35 17.65M17.65 6.35L19.07 4.93"
                        stroke="currentColor"
                        stroke-width="1.7"
                        stroke-linecap="round"/>
                </svg>

            </button>

        </div>

    </div>


    <!-- =====================================================
         ENQUIRY FORM
    ====================================================== -->

    <section class="enquiry-page" id="enquiryPage">

        <div class="enquiry-container">

            <div class="enquiry-heading">

                <span class="enquiry-eyebrow">GET IN TOUCH</span>

                <h1>We'd Love to Hear From You</h1>

                <p>
                    Have a question or need more information?
                    Send us your enquiry and our team will get back to you.
                </p>

            </div>

            <form class="enquiry-form" id="enquiryForm">

                <div class="enquiry-form-grid">

                    <div class="enquiry-field">
                        <label for="enquiryName">Full Name *</label>
                        <input type="text"
                               id="enquiryName"
                               name="name"
                               placeholder="Enter your full name"
                               autocomplete="name"
                               required>
                    </div>

                    <div class="enquiry-field">
                        <label for="enquiryEmail">Email Address *</label>
                        <input type="email"
                               id="enquiryEmail"
                               name="email"
                               placeholder="Enter your email address"
                               autocomplete="email"
                               required>
                    </div>

                    <div class="enquiry-field">
                        <label for="enquiryPhone">Phone Number *</label>
                        <input type="tel"
                               id="enquiryPhone"
                               name="phone"
                               placeholder="Enter your phone number"
                               autocomplete="tel"
                               required>
                    </div>

                    <div class="enquiry-field">
                        <label for="enquiryType">Enquiry Type *</label>

                        <select id="enquiryType"
                                name="enquiry_type"
                                required>

                            <option value="" disabled selected>
                                Select enquiry type
                            </option>

                            <option value="General Enquiry">General Enquiry</option>
                            <option value="Menu Enquiry">Menu Enquiry</option>
                            <option value="Catering">Catering</option>
                            <option value="Private Events">Private Events</option>
                            <option value="Feedback">Feedback</option>
                            <option value="Other">Other</option>

                        </select>
                    </div>

                    <div class="enquiry-field enquiry-field-full">
                        <label for="enquirySubject">Subject *</label>
                        <input type="text"
                               id="enquirySubject"
                               name="subject"
                               placeholder="Enter enquiry subject"
                               required>
                    </div>

                    <div class="enquiry-field enquiry-field-full">
                        <label for="enquiryMessage">Your Message *</label>
                        <textarea id="enquiryMessage"
                                  name="message"
                                  rows="5"
                                  placeholder="Write your enquiry here..."
                                  required></textarea>
                    </div>

                </div>

                <button type="submit" class="enquiry-submit-btn">
                    Submit Enquiry
                    <i class="fa-solid fa-arrow-right"
                       aria-hidden="true"></i>
                </button>

            </form>

        </div>

    </section>

</main>


<!-- JavaScript -->
<script src="js/script.js"></script>
<script src="js/site-settings.js"></script>

</body>
</html>
